name: Build runtime modules (from source)

# Builds the independent runtime APKs (Python + QuickJS) from the fork's
# own runtime/ project, signed with the same keystore as the app
# (app/debug.keystore, CN=Zhulong) so the app's "Invalid runtime signer"
# check accepts them. The official FongMi runtime APKs are signed with
# FongMi's key and can never be installed by our app.
#
# Outputs (arm64 only — the user's phone is arm64-v8a):
#   runtime/build/python/outputs/apk/arm64/release/runtime-python-arm64_v8a.apk
#   runtime/build/quickjs/outputs/apk/arm64/release/runtime-quickjs-arm64_v8a.apk
# Versions match the official catalog (python 1.1.3/113, quickjs 1.1.1/111)
# so the catalog entries stay compatible.
#
# The Python runtime needs app/libs/lib-mpvplayer-release.aar (cxxAar,
# verified by PreparePythonAarTask), so the FongMi native build runs
# first (same steps as android.yml). The Chaquopy runtime AAR is built
# before the runtime APKs because runtime/build.gradle reads it as a
# plain file (chaquo/runtime/build/outputs/aar/python-runtime-*.aar).

on:
  push:
    branches: [fongmi]
    paths:
      - '.github/workflows/runtime.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK 37 + NDK 29
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_DIR=$SDK_DIR"
          echo "--- already installed platforms ---"
          ls "$SDK_DIR/platforms" || true
          echo "--- already installed build-tools ---"
          ls "$SDK_DIR/build-tools" || true

          SDKMANAGER=""
          for c in "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$c" ]; then SDKMANAGER="$c"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -executable 2>/dev/null | head -n 1)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_DIR/cmdline-tools"
            ls -R "$SDK_DIR/cmdline-tools" || true
            exit 1
          fi
          chmod +x "$SDKMANAGER" || true
          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null || true

          NEED=""
          ls -d "$SDK_DIR/platforms/android-37"* >/dev/null 2>&1 || NEED="$NEED platforms;android-37"
          [ -d "$SDK_DIR/build-tools/37.0.0" ] || NEED="$NEED build-tools;37.0.0"
          [ -d "$SDK_DIR/ndk/29.0.14206865" ] || NEED="$NEED ndk;29.0.14206865"
          if [ -n "$NEED" ]; then
            echo "Installing missing:$NEED"
            "$SDKMANAGER" --sdk_root="$SDK_DIR" $NEED
          else
            echo "SDK 37 + NDK 29 already installed, skipping sdkmanager install"
          fi

      - name: Create local.properties
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "sdk.dir=$SDK_DIR"
            echo "storeFile=debug.keystore"
            echo "keyAlias=androiddebugkey"
            echo "storePassword=android"
          } > local.properties

      - name: Generate debug keystore
        run: |
          # The keystore is committed in the repo (app/debug.keystore, CN=Zhulong)
          # so every build signs with the same key and updates install in place.
          # Only generate a fresh one if it is missing (e.g. a clean fork).
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -storetype PKCS12 -keystore app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"
          else
            echo "Using committed keystore app/debug.keystore"
          fi

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml ujson pyquery requests jsonpath cachetools pycryptodome beautifulsoup4

      - name: FongMi Native Checkout
        run: |
          set -euxo pipefail
          MPA="${{ github.workspace }}/mpv-android"
          git clone --depth 1 --branch fongmi https://github.com/FongMi/mpv-android.git "$MPA"
          git clone --depth 1 --branch fongmi https://github.com/FongMi/mpv.git "$MPA/buildscripts/deps/mpv"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf pkgconf libtool ninja-build cmake python3-pip gperf nasm patch ant patchelf
          python3 -m pip install --upgrade "meson>=1.11.0"
          echo "meson: $(which meson) $(meson --version)"
          MESON_VER="$(meson --version)"
          if [ "$(printf '%s\n%s\n' "1.11.0" "$MESON_VER" | sort -V | head -n 1)" != "1.11.0" ]; then
            echo "::error::meson $MESON_VER is older than 1.11.0 (fontconfig requires >= 1.11.0)"
            exit 1
          fi

      - name: FongMi Native Export Env
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/mpv-android/buildscripts"
          ./include/ci.sh export >> "$GITHUB_ENV"

      - name: FongMi Native Cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mpv-android-cache
          key: "${{ env.CACHE_IDENTIFIER }}-TV"
          enableCrossOsArchive: true

      - name: FongMi Native Build
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/mpv-android/buildscripts"
          mkdir -p "${{ runner.temp }}/mpv-android-cache"
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          printf 'tries = 5\nretry_connrefused = on\nretry_on_http_error = 500,502,503,504\n' > "$HOME/.wgetrc"
          export MPV_GIT_REF=fongmi
          CACHE_MODE=folder CACHE_FOLDER="${{ runner.temp }}/mpv-android-cache" ./include/ci.sh install
          MPV_ANDROID_NATIVE_ONLY=1 ./include/ci.sh build

      - name: FongMi Native JNI & Package
        run: |
          set -euxo pipefail
          MPA="${{ github.workspace }}/mpv-android"
          SCRIPTS="${{ github.workspace }}/.github/scripts"
          TMP="${{ runner.temp }}"
          curl -sL -o "$TMP/ffmpeg_jni.cc" \
            "https://raw.githubusercontent.com/androidx/media/1.11.1/libraries/decoder_ffmpeg/src/main/jni/ffmpeg_jni.cc"
          NDK_DIR=$(ls -d "$MPA/buildscripts/sdk/android-ndk-r30" 2>/dev/null || ls -d "$MPA/buildscripts/sdk/android-ndk-"* 2>/dev/null | head -n 1)
          echo "NDK_DIR=$NDK_DIR"
          bash -e "$SCRIPTS/build_ffmpeg_jni.sh" \
            "$NDK_DIR" "$TMP/ffmpeg_jni.cc" \
            "$MPA/buildscripts/prefix" "$TMP/mpv-jni"
          python3 "$SCRIPTS/make_mpv_aars.py" \
            --libs-dir "$MPA/app/src/main/libs" \
            --jni-dir "$TMP/mpv-jni" \
            --out-dir "${{ github.workspace }}/app/libs"
          ls -la "${{ github.workspace }}/app/libs"
          rm -rf "$MPA"

      - name: Build Chaquopy runtime AAR
        run: |
          set -euxo pipefail
          cd chaquo/runtime
          chmod +x ../../gradlew
          ../../gradlew assembleArm64Release --stacktrace
          ls -la build/outputs/aar/

      - name: Build runtime APKs
        run: |
          set -euxo pipefail
          cd runtime
          chmod +x ../gradlew
          ../gradlew assembleArm64Release -PtvRuntimeModule=python -PtvPythonVersionCode=113 -PtvPythonVersionName=1.1.3 --stacktrace
          ../gradlew assembleArm64Release -PtvRuntimeModule=quickjs -PtvQuickJsVersionCode=111 -PtvQuickJsVersionName=1.1.1 --stacktrace
          ls -la build/python/outputs/apk/arm64/release/ build/quickjs/outputs/apk/arm64/release/

      - name: Upload runtime APKs
        uses: actions/upload-artifact@v4
        with:
          name: runtime-apks
          path: |
            runtime/build/python/outputs/apk/arm64/release/*.apk
            runtime/build/quickjs/outputs/apk/arm64/release/*.apk
          if-no-files-found: error
